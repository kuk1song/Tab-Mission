<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="optionsTitle">Tab Mission settings</title>
    <link rel="stylesheet" href="welcome.css" />
  </head>
  <body>
    <main class="card">
      <h1 data-i18n="optionsTitle">Tab Mission settings</h1>

      <h2 data-i18n="optionOpenHeading">When the overview opens</h2>
      <fieldset class="choices">
        <label>
          <input type="radio" name="open-selection" value="none" />
          <span data-i18n="optionOpenNone">Select nothing. Pressing the shortcut again closes the overview.</span>
        </label>
        <label>
          <input type="radio" name="open-selection" value="previous" />
          <span data-i18n="optionOpenPrevious">Select the previous tab. Pressing the shortcut again goes back to it.</span>
        </label>
      </fieldset>
      <p class="note" data-i18n="optionOpenNote">Either way, hover a tab and press the shortcut to switch to it, or press Esc to close.</p>

      <h2 data-i18n="optionShortcutsHeading">Keyboard shortcuts</h2>
      <p id="shortcuts" class="lead"></p>
      <div class="actions">
        <button id="set-shortcut" data-i18n="changeShortcutTitle">Change shortcut</button>
      </div>
      <p id="saved" class="note" hidden data-i18n="optionSaved">Saved.</p>
    </main>
    <script src="src/options.js" type="module"></script>
  </body>
</html>
