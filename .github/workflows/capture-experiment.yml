name: Capture experiment

# Experiment only, never merged: how often Chrome's page picture never comes
# back on macOS runners under each launch setting (tests/e2e/zz-capture-stress.spec.mjs).
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stress:
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: macos-stress, os: macos-latest, runs: '80', repeat: '1', only: tests/e2e/zz-capture-stress.spec.mjs }
          - { name: macos-suite-a, os: macos-latest, runs: '0', repeat: '3', only: '' }
          - { name: macos-suite-b, os: macos-latest, runs: '0', repeat: '3', only: '' }
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --no-shell chromium
      - name: Stress or the whole suite, no retries
        env:
          STRESS_RUNS: ${{ matrix.config.runs }}
          REPEAT: ${{ matrix.config.repeat }}
          ONLY: ${{ matrix.config.only }}
        run: npx playwright test $ONLY --repeat-each="$REPEAT" --retries=0 --reporter=line
