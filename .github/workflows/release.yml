name: Release

# Push a tag like v1.2.0 (on main, matching manifest.json) to build the store
# zip from a clean checkout, attest its provenance and publish a GitHub
# Release with it attached. Uploading to the Chrome Web Store stays manual.
on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write # store it
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the tagged commit is on main
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::tagged commit is not on main"; exit 1; }
      # No dependency cache in a release build (cache poisoning).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check the tag matches the manifest version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./extension/manifest.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match manifest version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps --no-shell chromium
      - run: npm run test:e2e
      - run: npm run package
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: builds/tab-mission-*.zip
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" builds/tab-mission-*.zip --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$TAG"
