name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the repo to run checks, so the
# automatically-provided GITHUB_TOKEN gets read-only scope. Nothing here writes
# back to the repository, comments, or releases.
permissions:
  contents: read

# A new push to a PR cancels its stale run, which saves minutes and gives
# faster feedback. Each push to main gets its own group (by commit), so every
# commit on main keeps a complete run, screenshots included.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  # Lint, JSON and permission checks, unit tests.
  check:
    runs-on: ubuntu-latest
    # Hard cap so a hung step (e.g. a stuck network install) can't burn the
    # 6-hour default. This job normally finishes in well under a minute.
    timeout-minutes: 10
    steps:
      # Actions are pinned to a full-length commit SHA (immutable) with the
      # human-readable version in a trailing comment. Dependabot keeps both in
      # sync. See .github/dependabot.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run validate:json
      - run: npm test

  # The unpacked extension in Playwright's Chromium (headless; headed on
  # Windows, see tests/e2e/fixtures.mjs), on each desktop OS: the shortcut
  # table, window frames and scrollbars differ on Windows and Linux.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # --no-shell: extensions need full Chromium; the headless shell is unused.
      - run: npx playwright install --with-deps --no-shell chromium
      - run: npm run test:e2e
      # Screenshots at 100%, 125% and 150% scaling (tests/e2e/visual.spec.mjs),
      # to review each OS from a Mac: gh run download <run> -n screens-<os>.
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screens-${{ matrix.os }}
          path: screens/
          if-no-files-found: ignore
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
