name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the repo to run checks, so the
# automatically-provided GITHUB_TOKEN gets read-only scope. Nothing here writes
# back to the repository, comments, or releases.
permissions:
  contents: read

# If new commits arrive on the same branch/PR while a run is in flight, cancel
# the stale run instead of queuing both, which saves minutes and gives faster
# feedback.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, JSON and permission checks, unit tests.
  check:
    runs-on: ubuntu-latest
    # Hard cap so a hung step (e.g. a stuck network install) can't burn the
    # 6-hour default. This job normally finishes in well under a minute.
    timeout-minutes: 10
    steps:
      # Actions are pinned to a full-length commit SHA (immutable) with the
      # human-readable version in a trailing comment. Dependabot keeps both in
      # sync. See .github/dependabot.yml.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run validate:json
      - run: npm test

  # The unpacked extension in Playwright's Chromium (new headless mode), on
  # each desktop OS: the shortcut table, window frames and scrollbars differ
  # on Windows and Linux.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # --no-shell: extensions need full Chromium; the headless shell is unused.
      - run: npx playwright install --with-deps --no-shell chromium
      - run: npm run test:e2e
      # Screenshots at 100%, 125% and 150% scaling (tests/e2e/visual.spec.mjs),
      # to review each OS from a Mac: gh run download <run> -n screens-<os>.
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screens-${{ matrix.os }}
          path: screens/
          if-no-files-found: ignore
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
